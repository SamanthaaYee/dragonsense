name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.17.4
      - run: python -m ruff check record_perg.py replay_lin_probe.py perg_signal.py perg_synthetic.py tests
      - run: python -m ruff format --check record_perg.py replay_lin_probe.py perg_signal.py perg_synthetic.py tests
      - run: python -m unittest discover -s tests -v
